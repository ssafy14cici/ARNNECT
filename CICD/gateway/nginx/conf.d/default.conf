        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI 페이지 (웹 화면)
    location /swagger-ui {
        proxy_pass http://test-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(glb|gltf|obj|fbx)$ {
        proxy_pass http://test-fe:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

}

# Jenkins
server {
    listen 9000 ssl; 
    location ~* \.(glb|gltf|obj|fbx)$ {
    # 1. 브라우저 캐시 기간을 1년으로 설정
    # (이 설정이 Cache-Control: max-age=... 헤더를 자동으로 만들어줍니다)
    expires 1y;

    # 2. 캐시 정책 명시
    # public: 모든 중간 서버(CDN 등)도 캐싱 가능
    # no-transform: 압축이나 변환 금지 (3D 파일 손상 방지)
    add_header Cache-Control "public, no-transform";

    # (선택) 3D 모델은 용량이 크므로 로그를 꺼서 디스크 I/O를 줄임
    access_log off;
}server_name i14e107.p.ssafy.io;

    # SSL 인증서 경로 
    ssl_certificate /etc/letsencrypt/live/i14e107.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14e107.p.ssafy.io/privkey.pem;

    # 보안 프로토콜 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        # 내부망에 있는 jenkins 컨테이너 이름과 포트(8080)로 전달
        proxy_pass http://jenkins:8080; 
        
        # HTTPS 처리를 위한 필수 헤더
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 젠킨스 경고 해결 (http -> https 리다이렉트 인식)
        proxy_redirect http:// https://;
    }
}
