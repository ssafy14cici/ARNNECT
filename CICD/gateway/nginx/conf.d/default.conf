# release
server {
    listen 80;
    server_name i14e107.p.ssafy.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name i14e107.p.ssafy.io;
    server_tokens off;

    # [인증서 경로]
    ssl_certificate /etc/letsencrypt/live/i14e107.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14e107.p.ssafy.io/privkey.pem;

    # [최적화 옵션]
    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # [Reverse Proxy]
    location / {
        proxy_pass http://prod-fe:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 페이지 캐싱 x
        #add_header Cache-Control "no-cache, no-store, must-revalidate";
        #add_header Pragma "no-cache";
    }

    location /api {
        proxy_pass http://prod-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(glb|gltf|obj|fbx)$ {
        proxy_pass http://prod-fe:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}

# develop
server {
    listen 8000;
    server_name i14e107.p.ssafy.io;
    server_tokens off;

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host:8001$request_uri;
    }
}


server {
    listen 8001 ssl;
    server_name i14e107.p.ssafy.io;
    server_tokens off;

    # [인증서 경로]
    ssl_certificate /etc/letsencrypt/live/i14e107.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14e107.p.ssafy.io/privkey.pem;

    # [최적화 옵션]
    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # [Reverse Proxy]
    location / {
        proxy_pass http://test-fe:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 페이지 캐싱 x
        #add_header Cache-Control "no-cache, no-store, must-revalidate";
