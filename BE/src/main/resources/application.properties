spring.application.name=arnnect

# .env import
spring.config.import=optional:file:.env[.properties]

# LOG
logging.level.root=INFO

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#REDIS
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# AI SERVER
recommend.ai.url=${RECOMMEND_AI_URL}

#GMS
remind.ai.key=${GMS_SECRET}
remind.ai.url=${GMS_URL}
remind.ai.version=gpt-4.1-mini

#JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=86400000
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
jwt.refresh-token-expire-time=1209600000

#File
file.base-dir=${FILE_BASE_DIR:/app/src}
# test
# file.base-dir=${FILE_BASE_DIR:D:/test}
#file.base-dir=C:/Users/SSAFY/Desktop/my_project/src/

#IMAGE
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
